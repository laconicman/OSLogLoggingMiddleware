name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Gate against a target importing a module it does not declare — the
      # regression this branch fixed (OpenAPIRuntime arrived transitively).
      - name: Build with explicit import check
        run: swift build --explicit-target-dependency-import-check error

      - name: Test
        run: swift test
